name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=coverage.txt ./...

      - name: Build binary
        run: go build -o leakmap ./cmd/leakmap

      - name: Smoke test
        run: ./leakmap --version
