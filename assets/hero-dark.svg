<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="LeakMap">
  <defs>
    <linearGradient id="lmBgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="lmTitleD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0ea5e9">
        <animate attributeName="offset" values="0.15;0.85;0.15" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lmEdgeD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="200" rx="18" fill="url(#lmBgD)"/>

  <g opacity="0.95">
    <circle cx="150" cy="120" r="13" fill="#38bdf8"/>
    <text x="150" y="150" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">wt-A</text>
    <circle cx="730" cy="120" r="13" fill="#fb7185"/>
    <text x="730" y="150" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">wt-B</text>
    <line x1="165" y1="120" x2="715" y2="120" stroke="url(#lmEdgeD)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#fb7185">
      <animateMotion dur="1.6s" repeatCount="indefinite" path="M165,120 L715,120"/>
    </circle>
  </g>

  <text x="60" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="52" font-weight="800" fill="url(#lmTitleD)">LeakMap</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.3s" fill="freeze"/>
    <text x="62" y="106" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#94a3b8">cross-worktree leak provenance + leak-map for parallel coding agents</text>
  </g>
</svg>
