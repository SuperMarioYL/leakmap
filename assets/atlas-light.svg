<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="LeakMap architecture">
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="redArrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="880" height="360" rx="16" fill="#f8fafc"/>

  <!-- connectors (drawn first, under nodes) -->
  <g fill="none" stroke="#64748b" stroke-width="2">
    <!-- Agent A writes -> fsnotify A -->
    <line x1="200" y1="70" x2="200" y2="116" stroke-dasharray="7 6" marker-end="url(#arrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <!-- Agent B writes -> fsnotify B -->
    <line x1="680" y1="70" x2="680" y2="116" stroke-dasharray="7 6" marker-end="url(#arrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite" begin="-0.5s"/>
    </line>
    <!-- fsnotify A -> leak.Detect -->
    <path d="M300,140 L350,216" stroke-dasharray="7 6" marker-end="url(#arrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- fsnotify B -> leak.Detect -->
    <path d="M580,140 L530,216" stroke-dasharray="7 6" marker-end="url(#arrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.2s" repeatCount="indefinite" begin="-0.6s"/>
    </path>
    <!-- secret fingerprints -> leak.Detect -->
    <line x1="170" y1="235" x2="346" y2="235" stroke-dasharray="7 6" marker-end="url(#arrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.3s" repeatCount="indefinite" begin="-0.3s"/>
    </line>
    <!-- leak.Detect -> render (leak stream, red) -->
    <line x1="440" y1="255" x2="440" y2="316" stroke="#f43f5e" stroke-dasharray="7 6" marker-end="url(#redArrowL)">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.0s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots travelling the connectors -->
  <g fill="#0ea5e9">
    <circle r="3.5"><animateMotion dur="1.1s" repeatCount="indefinite" path="M200,70 L200,116"/></circle>
    <circle r="3.5"><animateMotion dur="1.1s" repeatCount="indefinite" begin="-0.5s" path="M680,70 L680,116"/></circle>
    <circle r="3.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M300,140 L350,216"/></circle>
    <circle r="3.5"><animateMotion dur="1.2s" repeatCount="indefinite" begin="-0.6s" path="M580,140 L530,216"/></circle>
    <circle r="3.5" fill="#6366f1"><animateMotion dur="1.3s" repeatCount="indefinite" path="M170,235 L346,235"/></circle>
    <circle r="3.5" fill="#f43f5e"><animateMotion dur="1.0s" repeatCount="indefinite" path="M440,255 L440,316"/></circle>
  </g>

  <!-- nodes (with opacity breathing) -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-rendering="geometricPrecision">
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-0.2s"/>
      <rect x="100" y="30" width="200" height="40" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="200" y="55" text-anchor="middle" fill="#0f172a">Agent A @ worktree-A</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-0.8s"/>
      <rect x="580" y="30" width="200" height="40" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="680" y="55" text-anchor="middle" fill="#0f172a">Agent B @ worktree-B</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-1.4s"/>
      <rect x="100" y="120" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="200" y="145" text-anchor="middle" fill="#0f172a">fsnotify(wt-A)</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-2.0s"/>
      <rect x="580" y="120" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="680" y="145" text-anchor="middle" fill="#0f172a">fsnotify(wt-B)</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-0.5s"/>
      <rect x="20" y="215" width="150" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="95" y="240" text-anchor="middle" fill="#0f172a">secret fingerprints</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-1.1s"/>
      <rect x="350" y="215" width="180" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="440" y="240" text-anchor="middle" fill="#e2e8f0">leak.Detect</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="-1.7s"/>
      <rect x="300" y="316" width="280" height="36" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="440" y="339" text-anchor="middle" fill="#0f172a">render: TUI / HTML / report</text>
    </g>
  </g>

  <text x="455" y="295" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#f43f5e">LeakEvent stream (jsonl)</text>
</svg>
