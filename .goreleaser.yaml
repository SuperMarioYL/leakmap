version: 2

project_name: leakmap

before:
  hooks:
    - go mod tidy

builds:
  - id: leakmap
    main: ./cmd/leakmap
    binary: leakmap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "leakmap_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  use: gitlog
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  name_template: "LeakMap {{ .Version }}"
